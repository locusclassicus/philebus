<line x1="1164" y1="280" x2="1164" y2="520" stroke="#b68136" stroke-width="2"/>
<text x="1188" y="388.0" font-family="Arial, sans-serif" font-size="22" fill="#657078" text-anchor="start">предел</text>
<text x="1188" y="429.0" font-family="Arial, sans-serif" font-size="36" fill="#b68136" text-anchor="start">2:1</text>
