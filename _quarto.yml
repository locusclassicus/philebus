  output-dir: docs
  render:
    - "book/*.qmd"

website:
  title: "«Филеб»‎ Платона"
  navbar:
    background: light
    search: true
    left:
      - href: book/index.qmd
        text: Текст
      - href: book/translation.qmd
        text: Перевод
      - href: book/intro.qmd
        text: Введение
      - href: book/comments.qmd
        text: Комментарии
      - href: book/resources.qmd
